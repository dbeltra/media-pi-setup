x-no-ipv6: &no-ipv6
  # Host has no IPv6 default route. Without disabling IPv6 in the container,
  # .NET HTTP clients (Radarr/Sonarr/etc.) try AAAA addresses first and hang
  # for the full request timeout before falling back. Filtering at the kernel
  # level makes getaddrinfo skip AAAA results entirely.
  - net.ipv6.conf.all.disable_ipv6=1
  - net.ipv6.conf.default.disable_ipv6=1

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - WIREGUARD_ENDPOINT_IP=186.247.163.6
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_PUBLIC_KEY=5p4RkybdRU5uaDi90eu4KZPTFif0lKCg4Qp6t1c4F30=
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.5.0.2/32
      - FIREWALL_INPUT_PORTS=6881
    ports:
      - 8080:8000
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8081
    volumes:
      - ./config/qbittorrent:/config
      - /srv/downloads:/data/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config/jellyfin:/config
      - /mnt/media/movies:/data/movies
      - /mnt/media/tv:/data/tv
    ports:
      - 8096:8096
    sysctls: *no-ipv6
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/sonarr:/config
      - /mnt/media:/data
      - /srv/downloads:/data/downloads
    ports:
      - 8989:8989
    sysctls: *no-ipv6
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    extra_hosts:
      # Telefonica España has a routing/peering issue with the Cloudflare
      # prefix 188.114.0.0/22 that DNS returns for api.radarr.video. Pin to
      # a reachable Cloudflare anycast IP (104.18.x.x range is long-lived).
      - "api.radarr.video:104.18.114.5"
    volumes:
      - ./config/radarr:/config
      - /mnt/media:/data
      - /srv/downloads:/data/downloads
    ports:
      - 7878:7878
    sysctls: *no-ipv6
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    sysctls: *no-ipv6
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/bazarr:/config
      - /mnt/media:/data
    ports:
      - 6767:6767
    sysctls: *no-ipv6
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - 5055:5055
    sysctls: *no-ipv6
    restart: unless-stopped

  # Watched-media cleanup. Rules are configured through the web UI at :6246
  # (connect Jellyfin/Sonarr/Radarr/Seerr in Settings, then build a Collection
  # rule like "Jellyfin: last viewed > 7d ago AND last viewed not null" with
  # "delete" handling and "remove from arr after delete" enabled).
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: "1000:1000"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./config/maintainerr:/opt/data
    ports:
      - 6246:6246
    sysctls: *no-ipv6
    restart: unless-stopped

  caddy:
    build: ./caddy
    container_name: caddy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
      - ./www:/srv/www:ro 
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - TZ=Europe/Madrid
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      - FTLCONF_dns_upstreams=1.1.1.1;8.8.8.8
      - FTLCONF_webserver_port=8082
      - FTLCONF_dns_listeningMode=all
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:8082"
    restart: unless-stopped
